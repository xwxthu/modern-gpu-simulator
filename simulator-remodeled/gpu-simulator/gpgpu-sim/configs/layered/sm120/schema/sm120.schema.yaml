xml_inventory_policy:
  accelwattch_sass_sim.xml:
    rendered_strategy: copy_bootstrap_current_flat
    owner: calibration_result
    allowed_profiles: [bootstrap]
    active_elements:
      tags: [param, stat]
      required_attributes: [name, value]
    provenance_required: true
    power_profile_status: smoke_compatibility_only

icnt_inventory_policy:
  config_ampere_islip.icnt:
    rendered_strategy: copy_bootstrap_current_flat
    owner: sm120_base
    allowed_profiles: [bootstrap, smoke, performance]
    active_when:
      gpgpusim.config:
        "-network_mode": "1"
    current_sm120_note: >
      Current bootstrap SM120 configs use -network_mode 2 local xbar. The icnt
      file is copied for directory compatibility and future network_mode 1 work.

latency_groups:
  branch:
    gpgpusim_latency_key: "-branch_latency"
    gpgpusim_initiation_key: "-branch_initiation"
    trace_key: "-trace_opcode_latency_initiation_branch"
    drift_policy: same_value
  half:
    gpgpusim_latency_key: "-half_latency"
    gpgpusim_initiation_key: "-half_initiation"
    trace_key: "-trace_opcode_latency_initiation_half"
    drift_policy: same_value
  uniform:
    gpgpusim_latency_key: "-uniform_latency"
    gpgpusim_initiation_key: "-uniform_initiation"
    trace_key: "-trace_opcode_latency_initiation_uniform"
    drift_policy: same_value
  predicate:
    gpgpusim_latency_key: "-predicate_latency"
    gpgpusim_initiation_key: "-predicate_initiation"
    trace_key: "-trace_opcode_latency_initiation_predicate"
    drift_policy: same_value
  miscellaneous_queue:
    gpgpusim_latency_key: "-miscellaneous_queue_latency"
    gpgpusim_initiation_key: "-miscellaneous_queue_initiation"
    trace_key: "-trace_opcode_latency_initiation_miscellaneous_queue"
    drift_policy: same_value
  miscellaneous_no_queue:
    gpgpusim_latency_key: "-miscellaneous_no_queue_latency"
    gpgpusim_initiation_key: "-miscellaneous_no_queue_initiation"
    trace_key: "-trace_opcode_latency_initiation_miscellaneous_no_queue"
    drift_policy: same_value
