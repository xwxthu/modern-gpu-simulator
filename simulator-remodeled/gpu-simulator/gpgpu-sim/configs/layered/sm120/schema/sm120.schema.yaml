schema_version: 1
schema_id: sm120_bootstrap_mvp
description: >
  MVP owner/profile schema for SM120 bootstrap-current-flat config generation.
  The bootstrap generator validates every active option in the current flat
  SM120 gpgpusim.config and trace.config files against these exact owner lists.

profiles:
  bootstrap:
    allow_placeholder: true
    allow_inherited_from_5070ti: true
    allow_implicit_defaults: true
    omitted_implicit_defaults:
      - "-power_simulation_enabled"
  smoke:
    allow_placeholder: true
    allow_inherited_from_5070ti: true
    allow_implicit_defaults: false
  performance:
    allow_placeholder: false
    allow_inherited_from_5070ti: false
    allow_implicit_defaults: false

owners:
  sm120_base:
    description: SM120 common architecture model and simulator policy.
    allowed_profiles: [bootstrap, smoke, performance]
    default_source_type: manual_arch_model
  gpu_overlay:
    description: Per-GPU SKU facts and runtime/device limits.
    allowed_profiles: [bootstrap, smoke, performance]
    default_source_type: placeholder
  calibration_result:
    description: Bootstrap timing, cache, memory, scheduler, RF, PRT, and trace values.
    allowed_profiles: [bootstrap, smoke, performance]
    default_source_type: placeholder

